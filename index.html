<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>recoil-sweep — 無重力デブリ回収</title>
<style>
  html,body{margin:0;padding:0;background:#05070d;overflow:hidden;}
  canvas{display:block;background:#05070d;cursor:crosshair;}
  #hint{
    position:absolute;left:0;top:0;width:460px;text-align:center;
    color:#7f93b0;font:12px monospace;padding-top:4px;pointer-events:none;
  }
</style>
</head>
<body>
<canvas id="c" width="460" height="420"></canvas>
<div id="hint">マウス=照準　Space=投げる(反動)　C=姿勢制御/スラスタ　X=壁キック(壁沿いで無料)</div>
<script>
(function(){
"use strict";

var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var W = canvas.width, H = canvas.height;

// ---- ベクトル(x,y,z)。今は z を常に 0 で運ぶだけだが、
// 物理コア(位置・速度・壁)を x/y/z で統一しておくことで、
// 3D化するときにこの層のコードを書き換えずに z を動かせるようにしてある。 ----
function vec(x,y,z){ return {x:x||0, y:y||0, z:z||0}; }
function vAdd(a,b){ return vec(a.x+b.x, a.y+b.y, a.z+b.z); }
function vSub(a,b){ return vec(a.x-b.x, a.y-b.y, a.z-b.z); }
function vScale(a,s){ return vec(a.x*s, a.y*s, a.z*s); }
function vLen(a){ return Math.sqrt(a.x*a.x + a.y*a.y + a.z*a.z); }

// ---- 定数 ----
var WALL_X = 100;
var AIRLOCK_Y0 = 160, AIRLOCK_Y1 = 260;
var PLAYER_R = 14, PLAYER_MASS = 6;
var THROW_IMPULSE = 60;
var WALL_REST = 0.55; // 外周の反発係数
var BASE_RCS_ACCEL = 25; // 何も持たなくても使える弱い姿勢制御。解放前の詰み防止
var THRUSTER_ACCEL = 140;
var FUEL_MAX = 100, FUEL_DRAIN = 40, FUEL_REGEN = 12;
var MAGNET_RADIUS = 140, MAGNET_ACCEL = 90;
var MAX_DEBRIS = 10, SPAWN_INTERVAL = 4.5;
var INITIAL_DEBRIS = 7;
var WALL_KICK_IMPULSE = 50, WALL_KICK_TOUCH_DIST = 10, WALL_KICK_COOLDOWN = 0.35;

var UNLOCK_CAP2 = 5;
var UNLOCK_THRUSTER = 12;
var UNLOCK_MAGNET = 22;

var TYPES = [
  {key:'small',  mass:1.0, r:9,  color:'#8fd3ff', value:1},
  {key:'medium', mass:2.0, r:15, color:'#ffd38f', value:2},
  {key:'large',  mass:3.2, r:21, color:'#ff8f8f', value:3}
];

// ---- 壁。軸(x/y/z)ごとにデータとして持ち、反射処理は軸に依存しない汎用コードで行う。
// 3D化するときは奥行き方向(z)の壁を OUTER_WALLS に2個足すだけで、
// このファイルの反射ロジックは一切変更しなくてよいはずの設計。 ----
function makeWall(axis, side, boundary){
  var normal = vec(0,0,0);
  normal[axis] = (side === 'min') ? 1 : -1;
  return {axis:axis, side:side, boundary:boundary, normal:normal};
}
function wallGap(wall, pos, r){
  return (wall.side === 'min')
    ? ((pos[wall.axis] - r) - wall.boundary)
    : (wall.boundary - (pos[wall.axis] + r));
}
function wallBounce(wall, obj, r){
  obj.pos[wall.axis] = (wall.side === 'min') ? (wall.boundary + r) : (wall.boundary - r);
  obj.vel[wall.axis] = -obj.vel[wall.axis] * WALL_REST;
}
var HULL_WALL = makeWall('x', 'min', WALL_X); // ドッキング面。エアロック判定を持つため専用処理
var OUTER_WALLS = [
  makeWall('x', 'max', W),
  makeWall('y', 'min', 0),
  makeWall('y', 'max', H)
];
function applyOuterWalls(obj, r){
  for (var i=0;i<OUTER_WALLS.length;i++){
    var wall = OUTER_WALLS[i];
    if (wallGap(wall, obj.pos, r) < 0) wallBounce(wall, obj, r);
  }
}
function nearestTouchableWall(pos, r){
  var best = null, g;
  var inGap = (pos.y > AIRLOCK_Y0 && pos.y < AIRLOCK_Y1);
  if (!inGap){
    g = wallGap(HULL_WALL, pos, r);
    if (g <= WALL_KICK_TOUCH_DIST && (!best || g < best.gap)) best = {wall:HULL_WALL, gap:g};
  }
  for (var i=0;i<OUTER_WALLS.length;i++){
    g = wallGap(OUTER_WALLS[i], pos, r);
    if (g <= WALL_KICK_TOUCH_DIST && (!best || g < best.gap)) best = {wall:OUTER_WALLS[i], gap:g};
  }
  return best ? best.wall : null;
}

// ---- 状態 ----
// プレイヤーは壁沿い(船体に接した位置)から始まる。壁キックが初手から使える合図にする。
// y はエアロックの隙間を避け、船体の実体面(壁)に接する位置にする。
// 隙間の正面だと蹴る壁が無く、壁キックが初手から使えない。
var player = {pos: vec(WALL_X + PLAYER_R + 1, AIRLOCK_Y1 + 50), vel: vec(0,0)};
var held = [];       // [{mass,r,color,value,key}]
var capacity = 1;
var debrisList = []; // [{pos,vel,mass,r,color,value,key}]
var score = 0;
var unlocks = {cap2:false, thruster:false, magnet:false};
var fuel = 0;
var spawnTimer = SPAWN_INTERVAL;
var mouse = {x: player.pos.x+100, y: player.pos.y};
var keys = {c:false};
var wallKickCooldown = 0;
var kickFx = {x:0, y:0, t:0};
var toast = {text:'', t:0};
var stars = [];

for (var i=0;i<60;i++){
  stars.push({x: Math.random()*W, y: Math.random()*H, r: Math.random()*1.4+0.3});
}

function randType(){
  return TYPES[Math.floor(Math.random()*TYPES.length)];
}

function spawnDebris(){
  var t = randType();
  var x, y, tries = 0;
  do {
    x = WALL_X + 40 + Math.random()*(W - WALL_X - 60);
    y = 20 + Math.random()*(H-40);
    tries++;
  } while (dist(x,y,player.pos.x,player.pos.y) < 70 && tries < 10);
  var ang = Math.random()*Math.PI*2;
  var spd = 8 + Math.random()*20;
  debrisList.push({
    pos: vec(x,y),
    vel: vec(Math.cos(ang)*spd, Math.sin(ang)*spd),
    mass:t.mass, r:t.r, color:t.color, value:t.value, key:t.key
  });
}

for (var i=0;i<INITIAL_DEBRIS;i++) spawnDebris();

function dist(x1,y1,x2,y2){
  var dx=x1-x2, dy=y1-y2;
  return Math.sqrt(dx*dx+dy*dy);
}

function effMass(){
  var m = PLAYER_MASS;
  for (var i=0;i<held.length;i++) m += held[i].mass;
  return m;
}

function aimAngle(){
  return Math.atan2(mouse.y - player.pos.y, mouse.x - player.pos.x);
}

function throwHeld(){
  if (held.length === 0) return;
  var item = held.shift();
  var massAfter = effMass(); // held already shifted, so this excludes item
  var ang = aimAngle();
  var dir = vec(Math.cos(ang), Math.sin(ang));
  var J = THROW_IMPULSE;

  item.vel = vAdd(player.vel, vScale(dir, J/item.mass));
  item.pos = vAdd(player.pos, vScale(dir, PLAYER_R+item.r+2));
  debrisList.push(item);

  player.vel = vAdd(player.vel, vScale(dir, -(J/massAfter)));
}

// 壁キック: 壁に触れている間だけ使える無料の移動。反動用の投擲物が無い開始直後の詰みを防ぎつつ、
// デブリの消費(投擲)とは別枠の「壁を蹴る」移動手段として独立させている。
function tryWallKick(){
  if (wallKickCooldown > 0) return;
  var wall = nearestTouchableWall(player.pos, PLAYER_R);
  if (!wall) return;
  var ang = aimAngle();
  var aim = vec(Math.cos(ang), Math.sin(ang));
  var dir = vAdd(wall.normal, vScale(aim, 0.6));
  var len = vLen(dir) || 1;
  dir = vScale(dir, 1/len);
  var m = effMass();
  player.vel = vAdd(player.vel, vScale(dir, WALL_KICK_IMPULSE/m));
  wallKickCooldown = WALL_KICK_COOLDOWN;
  kickFx = {x: player.pos.x, y: player.pos.y, t: 0.25};
}

function showToast(text){
  toast.text = text;
  toast.t = 3.0;
}

function checkUnlocks(){
  if (!unlocks.cap2 && score >= UNLOCK_CAP2){
    unlocks.cap2 = true; capacity = 2;
    showToast('解放: 貨物スロット+1 (容量2)');
  }
  if (!unlocks.thruster && score >= UNLOCK_THRUSTER){
    unlocks.thruster = true; fuel = FUEL_MAX;
    showToast('解放: スラスタ (Cキー)');
  }
  if (!unlocks.magnet && score >= UNLOCK_MAGNET){
    unlocks.magnet = true;
    showToast('解放: マグネット回収');
  }
}

function update(dt){
  if (wallKickCooldown > 0) wallKickCooldown = Math.max(0, wallKickCooldown - dt);
  if (kickFx.t > 0) kickFx.t -= dt;

  // スラスタ: 解放前は弱い姿勢制御(燃料消費なし)、解放後は強力(燃料を消費)
  if (keys.c){
    var ang = aimAngle();
    var accel = (unlocks.thruster && fuel > 0) ? THRUSTER_ACCEL : BASE_RCS_ACCEL;
    player.vel.x += Math.cos(ang)*accel*dt;
    player.vel.y += Math.sin(ang)*accel*dt;
    if (unlocks.thruster && fuel > 0) fuel = Math.max(0, fuel - FUEL_DRAIN*dt);
  } else if (unlocks.thruster) {
    fuel = Math.min(FUEL_MAX, fuel + FUEL_REGEN*dt);
  }

  // マグネット: 一番近い浮遊デブリを引く
  if (unlocks.magnet){
    var nearest = null, nd = MAGNET_RADIUS;
    for (var i=0;i<debrisList.length;i++){
      var d = dist(debrisList[i].pos.x,debrisList[i].pos.y,player.pos.x,player.pos.y);
      if (d < nd){ nd = d; nearest = debrisList[i]; }
    }
    if (nearest){
      var pd = vSub(player.pos, nearest.pos);
      var pdLen = vLen(pd) || 1;
      nearest.vel = vAdd(nearest.vel, vScale(pd, (MAGNET_ACCEL/pdLen)*dt));
    }
  }

  // 積分: プレイヤー
  player.pos = vAdd(player.pos, vScale(player.vel, dt));

  // 積分: デブリ
  for (var i=0;i<debrisList.length;i++){
    debrisList[i].pos = vAdd(debrisList[i].pos, vScale(debrisList[i].vel, dt));
  }

  // 外周反射: プレイヤー(船体面以外)
  applyOuterWalls(player, PLAYER_R);

  // ステーション船体 / エアロック
  if ((player.pos.x - PLAYER_R) < WALL_X){
    var inGap = (player.pos.y > AIRLOCK_Y0 && player.pos.y < AIRLOCK_Y1);
    if (inGap && held.length > 0){
      var gained = 0;
      for (var i=0;i<held.length;i++) gained += held[i].value;
      score += gained;
      held = [];
      checkUnlocks();
    }
    player.pos.x = WALL_X + PLAYER_R;
    player.vel.x = 0; player.vel.y = 0;
  }

  // 外周反射 + 船体反射: デブリ
  for (var i=0;i<debrisList.length;i++){
    var d = debrisList[i];
    if (wallGap(HULL_WALL, d.pos, d.r) < 0) wallBounce(HULL_WALL, d, d.r);
    applyOuterWalls(d, d.r);
  }

  // 回収 (非弾性合体)
  if (held.length < capacity){
    for (var i=debrisList.length-1;i>=0;i--){
      var d = debrisList[i];
      if (dist(player.pos.x,player.pos.y,d.pos.x,d.pos.y) <= PLAYER_R + d.r){
        var m0 = effMass();
        player.vel = vScale(vAdd(vScale(player.vel,m0), vScale(d.vel,d.mass)), 1/(m0+d.mass));
        held.push({mass:d.mass, r:d.r, color:d.color, value:d.value, key:d.key});
        debrisList.splice(i,1);
        if (held.length >= capacity) break;
      }
    }
  }

  // 補充
  spawnTimer -= dt;
  if (spawnTimer <= 0 && debrisList.length < MAX_DEBRIS){
    spawnDebris();
    spawnTimer = SPAWN_INTERVAL * (0.7 + Math.random()*0.6);
  }

  if (toast.t > 0) toast.t -= dt;
}

function draw(){
  ctx.clearRect(0,0,W,H);

  // 星
  ctx.fillStyle = '#1b2436';
  for (var i=0;i<stars.length;i++){
    ctx.beginPath();
    ctx.arc(stars[i].x, stars[i].y, stars[i].r, 0, Math.PI*2);
    ctx.fill();
  }

  // ステーション船体
  ctx.fillStyle = '#3a4a63';
  ctx.fillRect(0,0,WALL_X,AIRLOCK_Y0);
  ctx.fillRect(0,AIRLOCK_Y1,WALL_X,H-AIRLOCK_Y1);
  ctx.fillStyle = unlocks.cap2 ? '#4fe08f' : '#2f8f5f';
  ctx.fillRect(0,AIRLOCK_Y0,WALL_X,AIRLOCK_Y1-AIRLOCK_Y0);
  ctx.strokeStyle = '#86f0b8';
  ctx.lineWidth = 2;
  ctx.strokeRect(2,AIRLOCK_Y0+2,WALL_X-4,AIRLOCK_Y1-AIRLOCK_Y0-4);

  // デブリ
  for (var i=0;i<debrisList.length;i++){
    var d = debrisList[i];
    ctx.beginPath();
    ctx.fillStyle = d.color;
    ctx.arc(d.pos.x,d.pos.y,d.r,0,Math.PI*2);
    ctx.fill();
  }

  // 照準線
  var ang = aimAngle();
  ctx.strokeStyle = 'rgba(255,255,255,0.25)';
  ctx.setLineDash([4,6]);
  ctx.beginPath();
  ctx.moveTo(player.pos.x,player.pos.y);
  ctx.lineTo(player.pos.x+Math.cos(ang)*600, player.pos.y+Math.sin(ang)*600);
  ctx.stroke();
  ctx.setLineDash([]);

  // 壁キックの発光
  if (kickFx.t > 0){
    ctx.beginPath();
    ctx.strokeStyle = 'rgba(143,211,255,' + Math.max(0,kickFx.t/0.25) + ')';
    ctx.lineWidth = 3;
    ctx.arc(kickFx.x, kickFx.y, PLAYER_R + (0.25-kickFx.t)*60, 0, Math.PI*2);
    ctx.stroke();
  }

  // プレイヤー
  ctx.beginPath();
  ctx.fillStyle = '#eef3ff';
  ctx.arc(player.pos.x,player.pos.y,PLAYER_R,0,Math.PI*2);
  ctx.fill();
  if (keys.c){
    ctx.beginPath();
    ctx.fillStyle = '#ffb347';
    ctx.arc(player.pos.x-Math.cos(ang)*(PLAYER_R+6), player.pos.y-Math.sin(ang)*(PLAYER_R+6), 5, 0, Math.PI*2);
    ctx.fill();
  }

  // 保持中デブリ(プレイヤー脇に表示)
  for (var i=0;i<held.length;i++){
    var h = held[i];
    ctx.beginPath();
    ctx.fillStyle = h.color;
    ctx.arc(player.pos.x - PLAYER_R - 4 - i*12, player.pos.y - PLAYER_R - 4, 6, 0, Math.PI*2);
    ctx.fill();
  }

  // HUD
  ctx.fillStyle = '#eef3ff';
  ctx.font = '16px monospace';
  ctx.fillText('SCORE: ' + score, 10, 20);
  ctx.fillText('貨物: ' + held.length + '/' + capacity, 10, 40);

  if (unlocks.thruster){
    ctx.strokeStyle = '#7f93b0';
    ctx.strokeRect(10, H-24, 100, 10);
    ctx.fillStyle = '#ffb347';
    ctx.fillRect(10, H-24, 100*(fuel/FUEL_MAX), 10);
    ctx.fillStyle = '#7f93b0';
    ctx.font = '10px monospace';
    ctx.fillText('FUEL', 116, H-16);
  }

  var skillText = [];
  if (unlocks.cap2) skillText.push('容量2');
  if (unlocks.thruster) skillText.push('スラスタ');
  if (unlocks.magnet) skillText.push('マグネット');
  ctx.font = '11px monospace';
  ctx.fillStyle = '#7f93b0';
  ctx.fillText('解放済: ' + (skillText.length? skillText.join(' / ') : 'なし'), 10, 56);

  if (toast.t > 0){
    ctx.globalAlpha = Math.min(1, toast.t);
    ctx.fillStyle = '#ffe98f';
    ctx.font = 'bold 15px monospace';
    ctx.textAlign = 'center';
    ctx.fillText(toast.text, W/2, 34);
    ctx.textAlign = 'left';
    ctx.globalAlpha = 1;
  }
}

var lastT = null;
function frame(now){
  if (lastT === null) lastT = now;
  var dt = Math.min(0.05, (now - lastT)/1000);
  lastT = now;
  update(dt);
  draw();
  window.__debug = {
    score: score,
    held: held.length,
    capacity: capacity,
    unlocks: {cap2:unlocks.cap2, thruster:unlocks.thruster, magnet:unlocks.magnet},
    debrisCount: debrisList.length,
    fuel: fuel,
    touchingWall: !!nearestTouchableWall(player.pos, PLAYER_R),
    player: {x:player.pos.x, y:player.pos.y, vx:player.vel.x, vy:player.vel.y}
  };
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

// テスト用フック: 実ブラウザ入力の検証とは別に、物理ロジックを決定的に検証できるようにする
window.__test = {
  setAim: function(x,y){ mouse.x = x; mouse.y = y; },
  setThrust: function(on){ keys.c = !!on; },
  throwHeld: throwHeld,
  wallKick: tryWallKick,
  forceScore: function(n){ score = n; checkUnlocks(); }
};

canvas.addEventListener('mousemove', function(e){
  var rect = canvas.getBoundingClientRect();
  mouse.x = e.clientX - rect.left;
  mouse.y = e.clientY - rect.top;
});

window.addEventListener('keydown', function(e){
  if (e.code === 'Space'){ e.preventDefault(); throwHeld(); }
  if (e.code === 'KeyC'){ keys.c = true; }
  if (e.code === 'KeyX'){ tryWallKick(); }
});
window.addEventListener('keyup', function(e){
  if (e.code === 'KeyC'){ keys.c = false; }
});

})();
</script>
</body>
</html>
